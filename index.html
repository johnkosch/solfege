<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Ear Training</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f5f5f5; color:#222; }
  main { max-width:760px; margin:0 auto; padding:40px 20px 50px; text-align:center; }
  h1 { margin:0 0 28px; font-size:28px; font-weight:650; }
  #solution { min-height:260px; display:flex; align-items:center; justify-content:center; margin:0 auto 24px; }
  #solution img { max-width:100%; max-height:420px; height:auto; }
  .controls { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; }
  button { border:0; border-radius:7px; padding:12px 22px; font-size:17px; cursor:pointer; background:#222; color:white; min-width:120px; }
  button:hover { background:#444; }
  button:disabled { opacity:.45; cursor:default; }
  #next { display:none; }
    .voiceover-option {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      cursor: pointer;
    }

  #status { margin-top:18px; color:#666; font-size:14px; min-height:20px; }
</style>
</head>
<body>
<main id="app">
  <h1>Music Ear Training</h1>
  <div id="solution" aria-live="polite"></div>
  <div class="controls">
    <button id="reference" type="button">Sol Do</button>
    <button id="play" type="button">Play</button>
    <button id="reveal" type="button">Reveal Solution</button>
    <button id="next" type="button">Next</button>
  </div>
    <label class="voiceover-option">
      <input id="voiceover" type="checkbox" checked>
      Voiceover
    </label>
  <div id="status"></div>
</main>
<script>
(() => {
  const exercises = [
    { audio: "ddmsd.mp3", image: "ddmsd.png" },
    { audio: "ddsmd.mp3", image: "ddsmd.png" },
    { audio: "dmdsd.mp3", image: "dmdsd.png" },
    { audio: "dmsmd.mp3", image: "dmsmd.png" },
    { audio: "drmfs.mp3", image: "drmfs.png" },
    { audio: "drmrd.mp3", image: "drmrd.png" },
    { audio: "dsddd.mp3", image: "dsddd.png" },
    { audio: "dsdsd.mp3", image: "dsdsd.png" },
    { audio: "dsdsd_2.mp3", image: "dsdsd_2.png" },
    { audio: "dsdsd_3.mp3", image: "dsdsd_3.png" },
    { audio: "dsmsd.mp3", image: "dsmsd.png" },
    { audio: "dtltd.mp3", image: "dtltd.png" },
    { audio: "mdsdm.mp3", image: "mdsdm.png" },
    { audio: "mfsfm.mp3", image: "mfsfm.png" },
    { audio: "mrdrm.mp3", image: "mrdrm.png" },
    { audio: "msdsm.mp3", image: "msdsm.png" },
    { audio: "sdmds.mp3", image: "sdmds.png" },
    { audio: "sdmsd.mp3", image: "sdmsd.png" },
    { audio: "sfmfs.mp3", image: "sfmfs.png" },
    { audio: "sfmrd.mp3", image: "sfmrd.png" },
    { audio: "smdms.mp3", image: "smdms.png" }
  ];

  const playBtn = document.getElementById("play");
  const revealBtn = document.getElementById("reveal");
  const nextBtn = document.getElementById("next");
  const solution = document.getElementById("solution");
  const status = document.getElementById("status");

  const startup = new Audio("startup.mp3");
  startup.preload = "auto";

  let current = -1;
  let currentAudio = null;
  let revealed = false;
  let order = [];

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function newOrder() {
    order = shuffle(exercises.map((_, i) => i));
  }

  function playCurrent() {
    if (current < 0) return;
    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
    }
    currentAudio = new Audio(exercises[order[current]].audio);
    currentAudio.play().catch(() => {
      status.textContent = "Click Play to hear the exercise.";
    });
  }

  function loadExercise(index, autoPlay) {
    if (index >= order.length) newOrder();
    current = index % order.length;
    revealed = false;
    solution.innerHTML = "";
    revealBtn.style.display = "inline-block";
    revealBtn.disabled = false;
    nextBtn.style.display = "none";
    status.textContent = "";
    if (autoPlay) playCurrent();
  }

  playBtn.addEventListener("click", playCurrent);

  revealBtn.addEventListener("click", () => {
    if (current < 0) return;
    const ex = exercises[order[current]];
    solution.innerHTML = '<img src="' + ex.image + '" alt="Solution">';
    revealed = true;
    revealBtn.style.display = "none";
    nextBtn.style.display = "inline-block";

    // Speak the exercise filename as solfege:
    // d=do, r=re, m=mi, f=fa, s=sol, l=la, t=ti.
    // Use only the filename portion before the first "_" or "."
    // so suffixes and the file extension are never spoken.
    const baseName = ex.audio.split(/[_.]/, 1)[0];
    const names = {
      d: "dough", r: "ray", m: "me", f: "fa",
      s: "so", l: "la", t: "tea"
    };
    const spoken = [...baseName.toLowerCase()]
      .map(ch => names[ch])
      .filter(Boolean);

    if (voiceoverCheckbox.checked && "speechSynthesis" in window && spoken.length) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(spoken.join(", "));
      utterance.rate = 0.9;
      utterance.pitch = 1;
      window.speechSynthesis.speak(utterance);
    }
  });

  nextBtn.addEventListener("click", () => {
    loadExercise(current + 1, true);
  });

  // Tonal-center reference: available on demand and never part of the
  // exercise pool or solution flow.
  const referenceBtn = document.getElementById("reference");
const voiceoverCheckbox = document.getElementById("voiceover");
  referenceBtn.addEventListener("click", () => {
    startup.currentTime = 0;
    startup.play().catch(() => {});
  });

  newOrder();

  let startupFinished = false;
  let startupStarted = false;

  function beginFirstExercise() {
    if (!startupFinished) return;
    loadExercise(0, false);
  }

  startup.addEventListener("ended", () => {
    startupFinished = true;
    beginFirstExercise();
  }, {once: true});

  // Attempt autoplay immediately. Modern browsers may block unprompted audio;
  // if they do, we fall back to starting the orientation on the first user
  // interaction, while still preventing the exercise from starting first.
  const attemptStartup = () => {
    if (startupStarted) return;
    startupStarted = true;
    startup.currentTime = 0;
    const p = startup.play();
    if (p && p.catch) {
      p.catch(() => {
        startupStarted = false;
        startupFinished = true;
        beginFirstExercise();
      });
    }
  };

  attemptStartup();

  // Fallback only for browsers that enforce autoplay restrictions.
  window.addEventListener("pointerdown", () => {
    if (!startupFinished && !startupStarted) attemptStartup();
  }, {once: true, capture: true});

  window.addEventListener("keydown", () => {
    if (!startupFinished && !startupStarted) attemptStartup();
  }, {once: true, capture: true});
})();
</script>
</body>
</html>
